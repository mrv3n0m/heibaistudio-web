<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Ears (behind head) -->
  <circle cx="52"  cy="52"  r="26" fill="#111111"/>
  <circle cx="148" cy="52"  r="26" fill="#111111"/>

  <!-- Head -->
  <circle cx="100" cy="112" r="74" fill="white"/>

  <!-- Eye patches -->
  <ellipse cx="74"  cy="104" rx="22" ry="26" fill="#111111" transform="rotate(-12 74 104)"/>
  <ellipse cx="126" cy="104" rx="22" ry="26" fill="#111111" transform="rotate(12 126 104)"/>

  <!-- Eyes (white) -->
  <circle cx="74"  cy="105" r="10" fill="white"/>
  <circle cx="126" cy="105" r="10" fill="white"/>

  <!-- Pupils -->
  <circle cx="76"  cy="107" r="6" fill="#111111"/>
  <circle cx="128" cy="107" r="6" fill="#111111"/>

  <!-- Nose -->
  <ellipse cx="100" cy="126" rx="10" ry="7" fill="#111111"/>

  <!-- Mouth -->
  <path d="M92 133 Q100 141 108 133" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none"/>

</svg>
